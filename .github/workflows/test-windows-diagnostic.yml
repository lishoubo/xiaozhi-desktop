name: 验证 Windows 诊断脚本

on:
  push:
    branches: [dev]
    paths:
      - scripts/windows-install-diagnostic.cmd
      - scripts/create-windows-install-diagnostic.mjs
      - scripts/tests/windows-install-diagnostic.test.mjs
      - .github/workflows/test-windows-diagnostic.yml

jobs:
  diagnostic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/tests/windows-install-diagnostic.test.mjs
