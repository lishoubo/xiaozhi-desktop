name: hotel-butler-local

services:
  db:
    image: pgvector/pgvector:0.8.5-pg18
    restart: unless-stopped
    ports:
      - '${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  rms:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '${RMS_HOST_PORT:?Set RMS_HOST_PORT}:3306'
    environment:
      TZ: ${TZ:?Set TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    volumes:
      - rmsdata:/var/lib/mysql
      - ./rms-schema.sql:/docker-entrypoint-initdb.d/001-rms-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: 5s
      timeout: 5s
      retries: 20

  database-init:
    image: hotel-butler-server:local
    restart: 'no'
    environment:
      NODE_ENV: development
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-本地管理员}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'db:initialize', '--workspace', '@hotel-butler/server']

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      target: local-runtime
    image: hotel-butler-server:local
    restart: unless-stopped
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL}
      RMS_DATABASE_URL: ${COMPOSE_RMS_DATABASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      ORIGIN: https://localhost:${SERVER_HTTPS_PORT:-5173}
      LOCAL_HTTPS_CERT_DIR: /certs
      NODE_EXTRA_CA_CERTS: /certs/rootCA.pem
      SHOW_LOCAL_ADMIN_CREDENTIALS: 'true'
      XIAOZHI_RMS_SERVER_URL: ${XIAOZHI_RMS_SERVER_URL:-http://host.docker.internal:8080}
      AI_KIMI_API_KEY: ${AI_KIMI_API_KEY:-}
      AI_KIMI_BASE_URL: ${AI_KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      AI_KIMI_MODEL: ${AI_KIMI_MODEL:-kimi-k3}
      AI_PUBLIC_WEATHER_MCP_ENABLED: ${AI_PUBLIC_WEATHER_MCP_ENABLED:-true}
      AI_DMS_MCP_URL: ${AI_DMS_MCP_URL:-https://dms-mcpver-vjne-ndunixfhxl.cn-hangzhou.fcapp.run/sse}
      AI_DMS_MCP_BEARER_TOKEN: ${AI_DMS_MCP_BEARER_TOKEN:-}
      AI_DMS_DATABASE_ID: ${AI_DMS_DATABASE_ID:-}
      AI_DMS_DATABASE_NAME: ${AI_DMS_DATABASE_NAME:-}
      AI_MCP_SERVERS_JSON: ${AI_MCP_SERVERS_JSON:-{}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${SERVER_HTTPS_PORT:-5173}:4173'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./.cert:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      rms:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'apps/server/tests/compose/server-healthcheck.mjs']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

  connectivity-test:
    image: hotel-butler-server:local
    profiles: ['test']
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL}
      RMS_DATABASE_URL: ${COMPOSE_RMS_DATABASE_URL:-}
      SERVER_URL: https://server:4173
      NODE_EXTRA_CA_CERTS: /certs/rootCA.pem
    volumes:
      - ./.cert:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      rms:
        condition: service_healthy
      server:
        condition: service_healthy
    command: ['node', 'apps/server/tests/compose/connectivity.mjs']

volumes:
  pgdata:
  rmsdata:
