name: hotel-butler-production

services:
  db:
    image: pgvector/pgvector:${PGVECTOR_IMAGE_TAG:-0.8.5-pg18}
    restart: unless-stopped
    command: ['postgres', '-p', '${POSTGRES_PORT:-35432}']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?Set POSTGRES_DATA_DIR}
        target: /var/lib/postgresql
    ports:
      - '${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-35432}:${POSTGRES_PORT:-35432}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -p ${POSTGRES_PORT:-35432} -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  database-init:
    image: hotel-butler-server:${SERVER_IMAGE_TAG:-production}
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:?Set INITIAL_ADMIN_NAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?Set INITIAL_ADMIN_USERNAME}
    depends_on:
      db:
        condition: service_healthy
    command: ['node', '--experimental-strip-types', 'apps/server/scripts/initialize-database.ts']

  server:
    image: hotel-butler-server:${SERVER_IMAGE_TAG:-production}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      RMS_DATABASE_URL: ${RMS_DATABASE_URL:-}
      ORIGIN: ${ORIGIN:?Set ORIGIN to the Electron-facing HTTPS origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      AI_KIMI_API_KEY: ${AI_KIMI_API_KEY:?Set AI_KIMI_API_KEY}
      AI_KIMI_BASE_URL: ${AI_KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      AI_KIMI_MODEL: ${AI_KIMI_MODEL:-kimi-k3}
      AI_PUBLIC_WEATHER_MCP_ENABLED: ${AI_PUBLIC_WEATHER_MCP_ENABLED:-true}
      AI_DMS_MCP_URL: ${AI_DMS_MCP_URL:-https://dms-mcpver-vjne-ndunixfhxl.cn-hangzhou.fcapp.run/sse}
      AI_DMS_MCP_BEARER_TOKEN: ${AI_DMS_MCP_BEARER_TOKEN:-}
      AI_DMS_DATABASE_ID: ${AI_DMS_DATABASE_ID:-}
      AI_DMS_DATABASE_NAME: ${AI_DMS_DATABASE_NAME:-}
      AI_MCP_SERVERS_JSON: ${AI_MCP_SERVERS_JSON:-{}}
      XIAOZHI_RMS_SERVER_URL: ${XIAOZHI_RMS_SERVER_URL:?Set XIAOZHI_RMS_SERVER_URL to the RMS HTTPS API origin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_LOG_FILE: /var/log/hotel-butler/server.jsonl
      HOST: 0.0.0.0
      PORT: 3443
      SERVER_TLS_CERT_FILE: /certs/cert.pem
      SERVER_TLS_KEY_FILE: /certs/key.pem
      SERVER_HEALTH_URL: ${ORIGIN:?Set ORIGIN to the Electron-facing HTTPS origin}/api/trpc/system.health
      SERVER_HEALTH_CONNECT_ADDRESS: 127.0.0.1
      SERVER_HEALTH_CONNECT_PORT: 3443
      SERVER_HEALTH_CA_FILE: /certs/ca.pem
    ports:
      - '${SERVER_BIND_ADDRESS:-0.0.0.0}:${SERVER_HTTPS_PORT:-35443}:3443'
    volumes:
      - type: bind
        source: ${SERVER_TLS_CERT_DIR:?Set SERVER_TLS_CERT_DIR to the production certificate directory}
        target: /certs
        read_only: true
      - type: bind
        source: ${SERVER_LOG_DIR:?Set SERVER_LOG_DIR to the production server log directory}
        target: /var/log/hotel-butler
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: 5
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'apps/server/tests/compose/server-healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
